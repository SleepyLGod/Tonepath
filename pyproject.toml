[project]
name = "tonepath"
version = "0.1.0"
description = "Local-first terminal music state-transition agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mutagen>=1.47.0",
  "rich>=13.7.0",
  "textual>=0.70.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
mir = [
  "essentia>=2.1b6.dev1389",
]
models = [
  "audio-separator[cpu]>=0.44.1",
]

[project.scripts]
tonepath = "tonepath.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tonepath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
